# The dictionary stack. Priority mirrors plover.cfg order: higher shadows lower,
# and the list here is that file's list, top to bottom.
#
# `generator` names the script that writes a dictionary's source, and `golden`
# the golden files beside `tests/golden/NAME.tsv`. The compiler reads neither:
# they are how `scripts/check.sh NAME` finds a dictionary's checks.
system = "systems/stenotype-extended.toml"

# Stages: relations a dictionary's `pipeline` composes, from a word to what it
# writes. An xfst stage defines `Stage`. What each prefix of a pipeline relates
# is written under build/work/NAME/pipeline, which the generator resolves into
# the dictionary's source and check.sh holds to tests/golden/NAME/.

# Each word Typey Type writes, its pronunciations aligned to its spelling.
[[stage]]
name = "lexicon"
lexc = "dictionaries/lexicon.lexc"
generator = "scripts/gen-lexicon.py"

# Two words of one syllable, often written together: scripts/gen-two-word.py
# writes each pair as two of the lexicon's entries, the stressed one marked.
[[stage]]
name = "pairs"
lexc = "dictionaries/pairs.lexc"
generator = "scripts/gen-two-word.py"

# Two words contracted to one syllable, marked as two syllables are.
[[stage]]
name = "contract-pair"
xfst = ["dictionaries/stage.xfst", "dictionaries/aligned.xfst", "dictionaries/contract.xfst",
        "dictionaries/contract-pair.xfst"]

# A syllable's stroke by the vowel theory.
[[stage]]
name = "theory"
xfst = ["dictionaries/stage.xfst", "dictionaries/aligned.xfst", "dictionaries/theory-tables.xfst",
        "dictionaries/theory.xfst"]
generator = "scripts/gen-theory.py"

# A stem of one syllable or two, written as one syllable: the words the affix
# grammar could write, cut to their stems by scripts/gen-affixes.py.
[[stage]]
name = "affix-stems"
lexc = "dictionaries/affixes-stems.lexc"
generator = "scripts/gen-affixes.py"

# A syllable as it is, or two contracted to one, marked with what the stroke adds.
[[stage]]
name = "stem"
xfst = ["dictionaries/stage.xfst", "dictionaries/aligned.xfst", "dictionaries/contract.xfst",
        "dictionaries/one.xfst"]

# The marks applied: `^` and the other vowel's letter, or a prefix's cluster.
[[stage]]
name = "caret"
xfst = ["dictionaries/stage.xfst", "dictionaries/aligned.xfst", "dictionaries/caret.xfst"]

[[dict]]
name = "emily-symbols"
priority = 100
# The modifiers tables for `LitNum`, the binary number both dictionaries read.
xfst = ["dictionaries/emily-symbols-tables.xfst", "dictionaries/emily-modifiers-tables.xfst", "dictionaries/emily-symbols.xfst"]

[[dict]]
name = "phrasing-tag"
priority = 96
owns = "#"
# `#^`, the question tag. Its own artifact so that only a tagged clause carries
# the tag's features: see the file's header.
xfst = [
    "dictionaries/phrasing-subjects.xfst",
    "dictionaries/phrasing-lexicon.xfst",
    "dictionaries/phrasing.xfst",
    "dictionaries/phrasing-tag.xfst",
]

# `#` is the phrasing gate, and no other dictionary has an outline with it: see
# `owns` in docs/phrasing.md.
[[dict]]
name = "phrasing"
priority = 95
owns = "#"
xfst = [
    "dictionaries/phrasing-subjects.xfst",
    "dictionaries/phrasing-lexicon.xfst",
    "dictionaries/phrasing.xfst",
]

[[dict]]
name = "shrimple"
priority = 90
# A syllable at a time with no end, so the outlines have no longest and a host
# that needs one has to be told. 40 is what `Shrimple-WSI-English.py` declares.
strokes = 40
xfst = ["dictionaries/shrimple-tables.xfst", "dictionaries/shrimple.xfst"]

# The editable dictionaries are read as their files when the stack loads, so a
# host has somewhere to put a new entry: `user` is what Plover's Add Translation
# writes, being the first, and `stfst-user` what the Android keyboard defines.
[[dict]]
name = "user"
priority = 80
json = "dictionaries/user.json"
editable = true

[[dict]]
name = "stfst-user"
priority = 75
json = "dictionaries/stfst-user.json"
editable = true

[[dict]]
name = "phrases"
priority = 70
json = "dictionaries/phrases.json"

[[dict]]
name = "commands"
priority = 60
json = "dictionaries/commands.json"

[[dict]]
name = "emily-modifiers"
priority = 50
xfst = ["dictionaries/emily-symbols-tables.xfst", "dictionaries/emily-modifiers-tables.xfst", "dictionaries/emily-modifiers.xfst"]

# A stroke nothing matched, read as another with something written around it:
# the suffix keys, "the" on -T, and "and" on S-K-P-. A fold is only tried where
# nothing matched, so its priority only orders it among other folds; the bare
# suffix keys are ordinary entries, and it is their place that this is.
[[dict]]
name = "folds"
priority = 40
xfst = ["dictionaries/folds.xfst"]

# Clause rewrites over a part-of-speech tagger, which is a statistical model
# rather than a function of its input, so the record language has no meaning for
# one. Read as its file, Plover's `{:retro:…}` meta does the work; a host without
# it skips each entry. Phrasing's own fold is the alternative: see docs/parity.md.
[[dict]]
name = "semantic-retro"
priority = 38
json = "dictionaries/semantic-retro.json"
editable = true

[[dict]]
name = "two-syllable"
priority = 35
json = "dictionaries/two-syllable.json"
generator = "scripts/gen-two-syllable.py"
pipeline = ["lexicon", "stem", "theory", "caret"]

[[dict]]
name = "two-word"
priority = 34
json = "dictionaries/two-word.json"
generator = "scripts/gen-two-word.py"
pipeline = ["pairs", "contract-pair", "theory", "caret"]

[[dict]]
name = "affixes"
priority = 33
xfst = ["morphology/ortho.xfst", "dictionaries/affixes-lexicon.xfst", "dictionaries/affixes.xfst"]
generator = "scripts/gen-affixes.py"
pipeline = ["affix-stems", "stem", "theory", "caret"]

[[dict]]
name = "typey-type"
priority = 30
json = "dictionaries/typey-type-full.json"
# What the vowel table writes, read back.
generator = "scripts/gen-typey-vowels.py"
golden = ["tests/vowels.tsv"]

[[dict]]
name = "vowel-briefs"
priority = 25
# Written by scripts/gen-typey-vowels.py beside typey-type: only strokes no
# other entry writes, so its place below typey-type shadows nothing.
json = "dictionaries/vowel-briefs.json"
generator = "scripts/gen-typey-vowels.py"

# The retro family sits below everything else, so it cannot shadow a working
# entry. It is here because host contract items 5 and 6 are what it needed, and
# that is what M4 built.
#
# repeat-idioms above repeat-word, as `repeat-word.py` asks: an idiom overrides
# the trigrams whose third word is not the first (`^SKP` after IN is "in and out",
# not "in and in").

# The forward half of the same idea: a template around the word you write next,
# and an inflection stroked before it. Each writes its own word at once and holds
# only what belongs after the next unit, which is `[AFTER]`, so both are host 3
# and both hosts run them: the keyboard holds the tail itself and
# `plover_stfst.host` is an extension for it. `docs/retro.md` has the mechanism
# and why the record language could not do it.

[[dict]]
name = "frames"
priority = 6
plain = "dictionaries/frames.dict"

[[dict]]
name = "ahead"
priority = 5
plain = "dictionaries/ahead.dict"

[[dict]]
name = "retro-words"
priority = 9
# The words this dictionary is shown, which is `retro-words.py`'s WINDOW.
words = 16
xfst = [
    "dictionaries/retro-words-chars.xfst",
    "dictionaries/retro-words.xfst",
    "dictionaries/retro-words-menus.xfst",
]

[[dict]]
name = "repeat-idioms"
priority = 8
json = "dictionaries/repeat-idioms.json"

[[dict]]
name = "repeat-word"
priority = 7
plain = "dictionaries/repeat-word.dict"


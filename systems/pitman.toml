# Pitman's Shorthand, New Era, as a tape.
#
# Generated by tools/gen-dicts.mjs from theory/signs.json. Do not edit.
#
# One symbol per sign, not per segment. A segment is a chord, and written as
# one atomic symbol none of its parts is an edit, so "the circle was left off"
# and "the hook went on the wrong end" become unsayable. Those are the two
# things a Pitman error model most needs to say.
#
# The order is the order the pen makes the signs, which is also the order the
# encoder builds a segment in.

name      = "pitman"
order     = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@^"
separator = "/"
suffix_keys = "s"

[keys]
# ---- position
"A" = "position-1-"
"B" = "position-2-"
"C" = "position-3-"
# ---- onset
"D" = "onset-circle-s-"
"E" = "onset-circle-sw-"
"F" = "onset-loop-st-"
# ---- lead
"G" = "hook-r-"
"H" = "hook-l-"
"I" = "hook-w-"
"J" = "hook-wl-"
# ---- stroke
"K" = "pee"
"L" = "bee"
"M" = "tee"
"N" = "dee"
"O" = "chay"
"P" = "jay"
"Q" = "kay"
"R" = "gay"
"S" = "eff"
"T" = "vee"
"U" = "ith"
"V" = "thee"
"W" = "ess"
"X" = "zee"
"Y" = "ish"
"Z" = "ish-up"
"a" = "zhee"
"b" = "em"
"c" = "en"
"d" = "ing"
"e" = "ell-up"
"f" = "ell-down"
"g" = "ar-ar"
"h" = "ray-ray"
"i" = "way"
"j" = "yay"
"k" = "hay-up"
"l" = "hay-down"
# ---- weight
"m" = "-heavy"
# ---- length
"n" = "-half"
"o" = "-double"
# ---- hook1
"p" = "-hook1-hook-n"
"q" = "-hook1-hook-fv"
"r" = "-hook1-hook-shun"
# ---- ring1
"s" = "-ring1-circle-s"
"t" = "-ring1-circle-ses"
"u" = "-ring1-loop-st"
"v" = "-ring1-loop-str"
# ---- hook2
"w" = "-hook2-hook-shun"
# ---- ring2
"x" = "-ring2-circle-s"
"y" = "-ring2-circle-ses"
"z" = "-ring2-loop-st"
"@" = "-ring2-loop-str"
# ---- ring3
"^" = "-ring3-circle-s"

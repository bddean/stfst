# Plain English Stenotype, matching Plover's english_stenotype KEYS.

name      = "stenotype"
order     = "#STKPWHRAO*EUfrpblgtsdz"
separator = "/"

implicit_hyphen = "AO*EU"

[keys]
"#" = "#"
"S" = "S-"
"T" = "T-"
"K" = "K-"
"P" = "P-"
"W" = "W-"
"H" = "H-"
"R" = "R-"
"A" = "A-"
"O" = "O-"
"*" = "*"
"E" = "-E"
"U" = "-U"
"f" = "-F"
"r" = "-R"
"p" = "-P"
"b" = "-B"
"l" = "-L"
"g" = "-G"
"t" = "-T"
"s" = "-S"
"d" = "-D"
"z" = "-Z"

[numbers]
"1" = "S"
"2" = "T"
"3" = "P"
"4" = "H"
"5" = "A"
"0" = "O"
"6" = "f"
"7" = "p"
"8" = "l"
"9" = "t"

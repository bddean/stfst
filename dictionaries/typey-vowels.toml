# The vowel theory for Typey Type: which chord a spelling takes.
# `scripts/gen-typey-vowels.py` applies it; `~/.config/plover/VOWELS-DESIGN.md`
# says why each rule is what it is.
#
# A rule names the word's vowel letters (`spelling`). `a_e` is a vowel letter
# with a magic e (make), and a w, y or gh closing the run belongs to it (cow,
# day, sight). A spelling with several sounds is split by `sound`, CMU's name
# for the stressed vowel with R appended when an r follows (care is EHR). The
# first rule that matches wins.
#
# The `*` in a chord is the spelling bit: a long vowel written with a second
# vowel letter, where a magic-e or plain spelling of the same sound exists.

# Words the spelling tells apart, which Typey Type told apart one pair at a time.
pairs = [["see", "sea"], ["sale", "sail"], ["site", "sight"], ["rode", "road"],
         ["no", "know"], ["due", "dew"], ["want", "wont"]]

# --- a

[[rule]]
name = "a after w or qu"
spelling = ["a"]
sound = ["AA", "AH", "AAR", "AOR"]
after = ["w", "qu"]
chord = "A"
examples = ["want", "watch", "war", "squad"]

[[rule]]
name = "a as aw or ah"
spelling = ["a", "a_e"]
sound = ["AA", "AO"]
chord = "AU"
examples = ["all", "talk", "call", "calm"]

[[rule]]
name = "a"
spelling = ["a"]
chord = "A"
examples = ["at", "can", "back", "car"]

[[rule]]
name = "a_e long"
spelling = ["a_e"]
sound = ["EY", "EHR"]
chord = "AEU"
examples = ["make", "same", "place", "care"]

[[rule]]
name = "a_e short"
spelling = ["a_e"]
chord = "A"
examples = ["large", "chance", "dance"]

[[rule]]
name = "ai"
spelling = ["ai"]
chord = "AEU*"
examples = ["said", "air", "main", "paid"]

[[rule]]
name = "ay"
spelling = ["ay"]
chord = "AEU"
examples = ["way", "day", "say", "play"]

[[rule]]
name = "au aw augh"
spelling = ["au", "aw", "augh"]
chord = "AU"
examples = ["law", "cause", "saw", "caught"]

[[rule]]
name = "ough as aw"
spelling = ["ough"]
sound = ["AO", "AA"]
chord = "AU"
examples = ["thought", "brought", "bought"]

[[rule]]
name = "ough as oh"
spelling = ["ough"]
sound = ["OW"]
chord = "OE"
examples = ["though", "dough"]

[[rule]]
name = "ough as ow"
spelling = ["ough"]
sound = ["AW"]
chord = "OU"
examples = ["drought"]

[[rule]]
name = "ough as uh or oo"
spelling = ["ough"]
sound = ["AH", "UW"]
chord = "U"
examples = ["through", "tough", "rough"]


# Ireland chords on stfst's words, by sound, every word one stroke: stfst's
# onset, coda and (approximately) vowel chords, with the weak syllables as
# marker atoms the search places on the keys a two-syllable stroke leaves
# idle (^ + and, for a new layout, # @ *). -s, -ed and -ing fold as -S, -D, -G.

include = ["novo-words.toml"]

[encode]
scheme = "ireland"
policy = "one"
prefix_keys = ["R", "D", "B"]
le_en = true
infl_keys = ["s", "ed", "ing"]

[objective]
max_keys = 2

[zones]
M = "#@^+*"
P = "#@^+*"

[search]
method = "anneal+descent"
moves = 100000
seeds = 4

[fixed]
"L:B" = "PW"
"L:CH" = "KH"

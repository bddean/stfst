# `^` marks a weak syllable after the stressed one, `+` one before it. The
# vowel keys are the stressed vowel's chord; the weak vowel is not written. A
# one-syllable word whose plain stroke is taken is `^+`.

system = "../systems/stenotype-extended.toml"

[words]
source = "stfst-two-syllable"

[encode]
form = "position"
reach = "^+"

[fixed]
"X:a:A" = "^"
"X:a:E" = "^"
"X:a:EU" = "^"
"X:a:O" = "^"
"X:a:U" = "^"
"X:a:^" = "^"
"X:b:A" = "+"
"X:b:E" = "+"
"X:b:EU" = "+"
"X:b:O" = "+"
"X:b:U" = "+"
"X:b:^" = "+"
"X:1:^" = "^+"

# Shared by the stfst-or-* designs: a marker chord is OR'd into the stroke,
# so its vowel keys join the stressed vowel's. Every design here asks the
# stack about the same chords, so they share one encoding.

system = "../systems/stenotype-extended.toml"

[words]
source = "stfst-two-syllable"

[encode]
form = "position"
reach = [
  "^", "^A", "^O", "^E", "^U", "^*", "^EU",
  "+", "+A", "+O", "+E", "+U", "+*", "+EU",
  "^+", "^+A", "^+O", "^+E", "^+U", "^+*", "^+EU",
]

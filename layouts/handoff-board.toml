# The foot-steno handoff's 26-key board, on Stenotype Extended's keys.
#
# Handoff key -> stfst key: left outer ^ _ -> ^ +, the two S keys S s -> S @,
# the centre * and + -> * #. The rest keep their letters. Only the effort
# weights and the zones say where a key is, so any one-to-one map scores the
# same; this one keeps ^ and + where Stenotype Extended has them.

system = "../systems/stenotype-extended.toml"

[effort]
"^+" = 2.0
"@S" = 1.5
"TK" = 1.2
"PWHR" = 1.0
"#*" = 1.3
"AOEU" = 0.8
"-FRPB" = 1.0
"-LG" = 1.2
"-TS" = 1.5
"-DZ" = 2.0

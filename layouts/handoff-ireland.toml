# Handoff baseline: Ireland chords plus weak-syllable marker keys, nothing
# searched (irl_big.py, irl_effort.py: run_affix3's mask(Rm, PRE, {}, infl)).
# The handoff reports 1.18% loss, 7.91 weighted keys per stroke.
#
# Markers: s (here @) for a weak vowel before the stress, + (here #) after it,
# ^ for -y, _ (here +) for -le/-en, +^ for two weak vowels after; ^ _ ^_ as
# prefix keys for re-, de-, be-. -s is *Z and -ed *D; -ing is written as sounds.

include = ["handoff-board.toml"]

[words]
source = "handoff"
path = "${FOOT_STENO}/data/allw.jsonl"
min_f = 1e-8

[encode]
scheme = "ireland"
policy = "split"
prefix_keys = ["R", "D", "B"]
le_en = true
infl_keys = ["s", "ed"]


# stfst's two-syllable dictionary as it stands: every outline the compiled
# pipeline writes, its marks included, resolved against the rest of the stack
# the way scripts/gen-two-syllable.py resolves it. The study's scores for it
# are the `^` XOR rule's, which the pipeline wrote then.

system = "../systems/stenotype-extended.toml"

[words]
source = "stfst-two-syllable"

[encode]
form = "caret"

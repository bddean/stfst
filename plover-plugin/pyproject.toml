[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-stfst"
version = "0.1.0"
description = "Compiled finite-state steno dictionaries, read by Plover"
# `tomllib` reads the manifest. Plover 5 bundles 3.13.
requires-python = ">=3.11"
dependencies = ["plover>=4.0.0"]

# The name is the file extension, and an artifact is a directory called
# `something.stfst`.
[project.entry-points."plover.dictionary"]
stfst = "plover_stfst.dictionary:StfstDictionary"

# What a dictionary needs the host to say, where a lookup cannot be told it: a
# bound word, a window of written text, a window of the text after it, and a
# tail. The last two wait for a word, which is what the extension is for, and
# `stfst_drop` is how a tail's preview comes back off the screen. Same
# package as the dictionary; the extension still has to be enabled in Plover's
# configuration, like any other.
[project.entry-points."plover.meta"]
stfst_copy = "plover_stfst.host:stfst_copy"
stfst_retro = "plover_stfst.host:stfst_retro"
stfst_hold = "plover_stfst.host:stfst_hold"
stfst_frame = "plover_stfst.host:stfst_frame"
stfst_drop = "plover_stfst.host:stfst_drop"
# Not a host ability but a meta of its own: the words some suffixes make of the
# previous word, one per press.
stfst_ladder = "plover_stfst.morph:stfst_ladder"

# The translator's half: a held stroke waiting for the next unit, and a fold.
[project.entry-points."plover.extension"]
stfst = "plover_stfst.extension:Extension"
# Optional, and separate because it is a development loop and not a dictionary:
# it reloads an artifact that has been rebuilt, so a change needs no restart.
stfst_reload = "plover_stfst.reload:Reload"

[tool.setuptools]
packages = ["plover_stfst"]

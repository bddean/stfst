[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-stfst"
version = "0.1.0"
description = "Compiled finite-state steno dictionaries, read by Plover"
# `tomllib` reads the manifest. Plover 5 bundles 3.13.
requires-python = ">=3.11"
dependencies = ["plover>=4.0.0"]

# The name is the file extension, and an artifact is a directory called
# `something.stfst`.
[project.entry-points."plover.dictionary"]
stfst = "plover_stfst.dictionary:StfstDictionary"

# `[AFTER]`: a record whose tail belongs to the unit after it. The meta carries
# the tail out of the dictionary and writes nothing; the extension writes it when
# a translation puts a word on screen. Both halves are needed, and the extension
# has to be enabled in Plover's configuration like any other.
[project.entry-points."plover.meta"]
stfst_ahead = "plover_stfst.hold:stfst_ahead"

[project.entry-points."plover.extension"]
stfst_ahead = "plover_stfst.hold:Ahead"

[tool.setuptools]
packages = ["plover_stfst"]

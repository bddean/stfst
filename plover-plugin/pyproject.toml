[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-stfst"
version = "0.1.0"
description = "Compiled finite-state steno dictionaries, read by Plover"
# `tomllib` reads the manifest. Plover 5 bundles 3.13.
requires-python = ">=3.11"
dependencies = ["plover>=4.0.0"]

# The name is the file extension, and an artifact is a directory called
# `something.stfst`.
[project.entry-points."plover.dictionary"]
stfst = "plover_stfst.dictionary:StfstDictionary"

# A stroke whose answer belongs to the unit after it: a `[AFTER]` tail, or a
# frame reading the word it goes around. `stfst_hold` is what a dictionary
# answers with and writes nothing, `stfst_frame` writes a frame once the word is
# there, and the extension moves the one to the other. Same package as the
# dictionary; the extension still has to be enabled in Plover's configuration,
# like any other.
[project.entry-points."plover.meta"]
stfst_hold = "plover_stfst.hold:stfst_hold"
stfst_frame = "plover_stfst.hold:stfst_frame"

[project.entry-points."plover.extension"]
stfst = "plover_stfst.hold:Ahead"

[tool.setuptools]
packages = ["plover_stfst"]
